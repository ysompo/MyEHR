name: Desktop installers

on:
  push:
    branches: ["**"]
    paths: ["android/common/**", "android/desktop/**", "android/*.kts", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write  # to publish installers on the "desktop-latest" release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            ext: msi
            name: MyEHR-Windows.msi
          - os: macos-14        # Apple Silicon (M1 and newer)
            task: packageDmg
            ext: dmg
            name: MyEHR-Mac-AppleSilicon.dmg
          - os: macos-15-intel        # Intel Macs
            task: packageDmg
            ext: dmg
            name: MyEHR-Mac-Intel.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew --no-daemon :desktop:test
      - name: Build installer
        run: ./gradlew --no-daemon :desktop:${{ matrix.task }}
      - name: Rename
        run: |
          mkdir -p out
          cp desktop/build/compose/binaries/main/${{ matrix.ext }}/*.${{ matrix.ext }} "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: android/out/${{ matrix.name }}
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version file
        run: |
          printf '{"version": "1.0.%s"}\n' "$GITHUB_RUN_NUMBER" > dist/desktop-version.json
          cat dist/desktop-version.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: MyEHR for Windows and Mac (latest)
          prerelease: true
          body: |
            Windows: download MyEHR-Windows.msi. On the "Windows protected your PC" screen click More info, then Run anyway.
            Mac (M1 or newer): MyEHR-Mac-AppleSilicon.dmg. Older Intel Mac: MyEHR-Mac-Intel.dmg.
            On Mac, the first time: right-click the app, choose Open, then Open again.
          files: dist/*
          overwrite_files: true
