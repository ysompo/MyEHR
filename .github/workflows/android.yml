name: Android APK

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the signed APK on the "android-latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Release signing: add these repository secrets once (see docs/DEVELOPER.md).
      # Without them a debug-signed APK is built instead.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYEHR_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MYEHR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: env.MYEHR_KEYSTORE_PATH != ''
        env:
          MYEHR_KEYSTORE_PASSWORD: ${{ secrets.MYEHR_KEYSTORE_PASSWORD }}
          MYEHR_KEY_ALIAS: ${{ secrets.MYEHR_KEY_ALIAS }}
          MYEHR_KEY_PASSWORD: ${{ secrets.MYEHR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        if: env.MYEHR_KEYSTORE_PATH == ''
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: myehr-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      # Fixed download link used by the app's updater:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/MyEHR.apk (+ version.json)
      - name: Prepare update files
        if: env.MYEHR_KEYSTORE_PATH != ''
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MyEHR.apk"
          SHA=$(sha256sum "$RUNNER_TEMP/MyEHR.apk" | cut -d' ' -f1)
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"0.1.${GITHUB_RUN_NUMBER}\", \"sha256\": \"$SHA\"}" > "$RUNNER_TEMP/version.json"
          cat "$RUNNER_TEMP/version.json"
      - uses: softprops/action-gh-release@v2
        if: env.MYEHR_KEYSTORE_PATH != ''
        with:
          tag_name: android-latest
          name: MyEHR (latest Android build)
          prerelease: true
          body: "Latest signed build. On Android, install MyEHR.apk; later updates arrive inside the app."
          files: |
            ${{ runner.temp }}/MyEHR.apk
            ${{ runner.temp }}/version.json
          overwrite_files: true
