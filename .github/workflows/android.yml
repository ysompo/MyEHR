name: Android APK

on:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Release signing: add these repository secrets once (see android/README.md).
      # Without them a debug-signed APK is built instead.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYEHR_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MYEHR_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        if: env.MYEHR_KEYSTORE_PATH != ''
        env:
          MYEHR_KEYSTORE_PASSWORD: ${{ secrets.MYEHR_KEYSTORE_PASSWORD }}
          MYEHR_KEY_ALIAS: ${{ secrets.MYEHR_KEY_ALIAS }}
          MYEHR_KEY_PASSWORD: ${{ secrets.MYEHR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        if: env.MYEHR_KEYSTORE_PATH == ''
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: myehr-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
